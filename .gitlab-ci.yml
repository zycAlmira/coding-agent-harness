# GitLab CI/CD — AI4SE Project A Coding Agent Harness
# 通用要求 §五.6:必须含名为 unit-test 的 job。
# §4.8:每次 push 自动跑测试。§4.10:容器分发须含镜像构建步骤。
# §A.4 精神:配置正确性由 tests/unit/test_ci_config.py 确定性单测保护。

image: python:3.12-slim

stages:
  - test
  - build

variables:
  GIT_DEPTH: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache/
    - .pip-cache/

unit-test:
  stage: test
  before_script:
    - pip install --cache-dir=.pip-cache uv
    - uv sync --frozen --extra dev --no-progress
  script:
    - uv run pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build-image:
  stage: build
  image:
    name: docker:24
    entrypoint: [""]
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      exists:
        - Dockerfile
